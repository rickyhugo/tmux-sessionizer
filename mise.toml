[tools]
zig = "0.17.1"
hk = "2.12.0"
jj = "0.38.0"
tmux = "3.8"
python = "3.14.7"
rust = { version = "1.99.0", components = "rustfmt,clippy" }

[env]
RUSTUP_TOOLCHAIN = "1.99.0"

[tasks.build]
description = "Build the Zig executable"
run = "zig build"

[tasks."build:release"]
description = "Build zig-out/bin/tms with ReleaseFast"
run = "zig build -Doptimize=ReleaseFast"

[tasks.test]
description = "Run Zig tests"
run = "zig build test"

[tasks."test:adapters"]
description = "Verify tmux arguments, command policies, and a private tmux lifecycle"
run = "python3 src/app/check.py --real-tmux"

[tasks."test:matcher:diff"]
description = "Compare Zig ranking with the Rust oracle"
depends = ["build", "build:rust-oracle"]
run = "python3 src/matcher/check-parity.py --oracle zig-out/bin/tms-oracle --rust-oracle target/debug/examples/compat_oracle"

[tasks."build:rust"]
description = "Build the Rust reference executable"
run = "cargo build --locked"

[tasks."test:rust"]
description = "Run Rust reference tests"
run = "cargo test --locked"

[tasks."build:rust-oracle"]
description = "Build the Rust ranking reference"
run = "cargo build --locked --example compat_oracle"

[tasks."test:harness"]
description = "Check compatibility test isolation"
run = [
  "python3 -m unittest discover -s tests/compat -p 'test_*.py'",
  "python3 -m unittest discover -s tests/terminal -p 'test_*.py'",
]

[tasks."test:compat:rust"]
description = "Replay command and ranking fixtures against Rust"
depends = ["test:harness", "build:rust", "build:rust-oracle"]
run = "python3 scripts/compat.py --jj --oracle target/debug/examples/compat_oracle"

[tasks."test:compat"]
description = "Compare Zig commands and ranking with the Rust fixtures"
depends = ["test:harness", "build:release"]
run = "python3 scripts/compat.py --jj --bin zig-out/bin/tms --oracle zig-out/bin/tms-oracle"

[tasks."test:terminal:rust"]
description = "Exercise the Rust picker in isolated tmux terminals"
depends = ["build:rust"]
run = "python3 scripts/compat_terminal.py"

[tasks."test:terminal"]
description = "Exercise the Zig picker in isolated tmux terminals"
depends = ["build"]
run = "python3 scripts/compat_terminal.py --bin zig-out/bin/tms"

[tasks."test:terminal:strict"]
description = "Verify Zig PTY and popup behavior with Unicode and cleanup fixes"
depends = ["test:harness", "build:release"]
run = "python3 scripts/terminal_checks.py --binary zig-out/bin/tms --require-improvements --output .audit/terminal"

[tasks.fmt]
description = "Format Zig and Rust files through hk"
run = "hk fix --all --step zig-fmt --step rust-fmt"

[tasks."fmt:check"]
description = "Check Zig and Rust formatting through hk"
run = "hk check --all --step zig-fmt --step rust-fmt"

[tasks."hooks:setup"]
description = "Install repository-local hk hooks through mise"
run = '''
if [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ]; then
  echo "Install hooks from a standalone clone, not a linked worktree." >&2
  exit 1
fi
hk install --mise
'''

[tasks.check]
description = "Run all shared hk checks"
run = "hk check --all"

[tasks.ci]
description = "Validate hk and run the shared checks"
run = ["hk validate --deny-warnings", "hk check --all"]
